<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      (function () {
        const base = '/The-Unsolicited-Chosen-website/';
        const l = window.location;

        let path = l.pathname;
        if (path.startsWith(base)) {
          path = path.slice(base.length - 1);
        }

        const target = base + '?p=' + encodeURIComponent(path + l.search + l.hash);
        l.replace(target);
      })();
    </script>
  </body>
</html>
